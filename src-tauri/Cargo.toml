[package]
name = "kotoba-player"
version = "0.4.0"
description = "Anime video player with click-to-look-up Japanese dictionary and Anki mining"
authors = ["merunism"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kotoba_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-dialog = "2"
thiserror = "2"
base64 = "0.22"
subtitles = { version = "0.1.0", path = "../crates/subtitles" }
jptext = { version = "0.1.0", path = "../crates/jptext" }
ureq = { version = "3", default-features = false, features = ["json"] }
jpdict = { version = "0.1.0", path = "../crates/jpdict" }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Media_Core", "Media_SpeechSynthesis", "Storage_Streams", "Foundation", "Foundation_Collections"] }


